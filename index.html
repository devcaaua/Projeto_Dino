<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Dinossauro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="score-board">
            <span id="high-score">HI 00000</span>
            <span id="score">00000</span>
        </div>
        <div id="dino"></div>
        <div id="cactus"></div>
        <div class="floor"></div>
        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>Pressione barra de Espaço ou Toque para reiniciar</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
